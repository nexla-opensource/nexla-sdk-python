[build-system]
requires = ["setuptools>=67", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nexla-sdk"
dynamic = ["version"]
description = "A Python SDK for the Nexla API"
readme = "README.md"
authors = [
    {name = "Amey Desai", email = "amey.desai@nexla.com"},
    {name = "Saksham Mittal", email = "saksham.mittal@nexla.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Async client (nexla_sdk.aio). httpx supports Python 3.8.
async = [
    "httpx>=0.27",
]
dev = [
    "httpx>=0.27",
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "python-dotenv>=1.0.0",
    # Test utilities and libraries
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.0.0",
    "faker>=18.0.0",
    "PyYAML>=6.0.0",
    "responses>=0.23.0",
    "freezegun>=1.2.0",
    "factory-boy>=3.2.0",
    "ruff==0.14.14",  # keep in sync with .pre-commit-config.yaml and ci.yml
    # mypy 1.17+ rejects a python_version 3.8 target; 1.16.1 is the newest that accepts it.
    # mypy itself runs only on Python 3.9+, hence the marker.
    "mypy==1.16.1; python_version >= '3.9'",
    "types-requests; python_version >= '3.9'",
    # Types for the optional OpenTelemetry imports that mypy checks.
    "opentelemetry-api; python_version >= '3.9'",
]
tracing = [
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
]

[project.urls]
Homepage = "https://github.com/nexla-opensource/nexla-sdk-python"
Documentation = "https://github.com/nexla-opensource/nexla-sdk-python"
"Bug Tracker" = "https://github.com/nexla-opensource/nexla-sdk-python/issues"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["nexla_sdk*"]

[tool.setuptools.package-data]
nexla_sdk = ["py.typed"]

[tool.ruff]
# Python floor is 3.8. Do not add 3.9+ runtime syntax to nexla_sdk.
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: ruff format owns code width. Remaining hits are long string literals and
# comments that the formatter cannot wrap; splitting them hurts readability.
ignore = ["E501"]

[tool.ruff.lint.pyupgrade]
# Python 3.8 cannot evaluate list[...] or X | None at runtime, and pydantic
# evaluates model annotations. Keep typing.List / Optional in runtime contexts.
keep-runtime-typing = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# python_version 3.8 is the SDK floor. Pinned mypy 1.16.1 still accepts it.
python_version = "3.8"
strict = true
plugins = ["pydantic.mypy"]
files = ["nexla_sdk"]

# httpx imports anyio, which uses match statements that the 3.8 target cannot parse.
# Skipping anyio analysis does not affect checks of nexla_sdk code.
[[tool.mypy.overrides]]
module = ["anyio", "anyio.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
# Replaces the former pytest.ini. Single config file for pytest and coverage.
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (default)",
    "integration: Integration tests requiring real API credentials",
    "property: Hypothesis property-based tests",
    "performance: Performance and load tests",
    "contract: API contract validation tests",
    "slow: Slow running tests",
    "create_team: Integration helper marker for team creation scenarios",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--durations=10",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)s) "

[tool.coverage.run]
source = ["nexla_sdk"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    # Generated by scripts/gen_async.py from nexla_sdk/resources. The sync modules
    # are covered by the sync unit tests. CI checks that the generated files match.
    "*/nexla_sdk/aio/resources/*",
    "*/nexla_sdk/aio/raw_operations.py",
    "*/nexla_sdk/aio/auth.py",
]

[tool.coverage.report]
# CI enforces the floor with --cov-fail-under=85 (see .github/workflows/ci.yml).
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

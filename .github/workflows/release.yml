name: Release to PyPI

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing to PyPI

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Fetch full history for setuptools_scm to work properly
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Build only; the wheel is pure Python. 3.9 has no build on ubuntu-latest (26.04).
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools_scm
        pip install -r requirements.txt
        pip install -e .[dev]

    - name: Verify version from setuptools_scm
      run: |
        python -c "import setuptools_scm; print(f'Version: {setuptools_scm.get_version()}')"

    - name: Run unit tests
      run: |
        python -m pytest -m unit -q -p no:cacheprovider --cov=nexla_sdk --cov-fail-under=85

    - name: Build package
      run: |
        python -m build

    - name: Verify build contents
      run: |
        echo "=== Built packages ==="
        ls -la dist/
        echo "=== Checking wheel contents ==="
        python -m zipfile -l dist/*.whl | head -20
        # Fail the release if the license is missing from either artifact.
        tar -tzf dist/*.tar.gz | grep -q "/LICENSE$"
        python -m zipfile -l dist/*.whl | grep -q "licenses/LICENSE"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true

    - name: Create deployment summary
      run: |
        VERSION=$(python -c "import setuptools_scm; print(setuptools_scm.get_version())")
        echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
        echo "- **Tag**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Published to**: PyPI" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: nexla-sdk==$VERSION" >> $GITHUB_STEP_SUMMARY 
name: Docs Site

on:
  push:
    branches: [ main ]
    paths:
      - "docs-site/**"
      - "docs/**"
      - "nexla_sdk/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "docs-site/**"
      - "docs/**"
      - "nexla_sdk/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/docs.yml"

# Build-only check: the docs site is not deployed from this repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps and package
        working-directory: docs-site
        run: |
          python -m pip install --upgrade pip
          pip install -e "..[async]"

      - name: Generate API docs
        working-directory: docs-site
        run: |
          python3 scripts/gen_api_docs.py

      - name: Install Node deps
        working-directory: docs-site
        run: npm ci

      - name: Build
        working-directory: docs-site
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://example.com' }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
        run: |
          npm run build
